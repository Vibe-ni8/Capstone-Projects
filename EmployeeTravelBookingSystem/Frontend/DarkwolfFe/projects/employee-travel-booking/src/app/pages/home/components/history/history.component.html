<h3>Travel History</h3>

<table>
  <thead>
    <tr>
      <th>Destination</th>
      <th>Period</th>
      <th>Status</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let item of history">
      <td>{{ item.destination }}</td>
      <td>{{ item.startDate }} → {{ item.endDate }}</td>
      <td [class]="item.status.toLowerCase()">{{ item.status }}</td>
    </tr>
  </tbody>
</table>
