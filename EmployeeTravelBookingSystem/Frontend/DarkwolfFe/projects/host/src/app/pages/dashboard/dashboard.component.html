<div class="dashboard">
  <app-nav id="nav-target" [username]="username" [email]="email" [tabName]="currentTab">
    <div class="sidebar">
      <ul>
        <li *ngFor="let i of sideBarList" [routerLink]="i.link" routerLinkActive="active">{{i.name}}</li>
      </ul>
    </div>
  </app-nav>
  <div class="dashboard-content" (click)="closeMenus()">
    <router-outlet></router-outlet>
  </div>
</div>
