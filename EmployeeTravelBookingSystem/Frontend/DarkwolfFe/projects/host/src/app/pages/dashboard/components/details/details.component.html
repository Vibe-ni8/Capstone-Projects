<div class="details-container">
  <h2 class="title">Dashboard</h2>
  <div class="card-grid">
    <div class="card" *ngFor="let item of modules" (click)="navigate(item)">
      <div class="icon"><i class="{{item.icon}}"></i></div>
      <h3>{{item.title}}</h3>
      <p>{{item.description}}</p>
    </div>
  </div>
</div>
